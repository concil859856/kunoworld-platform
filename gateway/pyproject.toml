[project]
name = "kuno-gateway"
version = "0.1.0"
description = "KunoWorld platform gateway (private): accounts, billing, routing and the ciphertext-only job queue"
requires-python = ">=3.10"
dependencies = [
    "kuno-protocol",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
]

[project.scripts]
kuno-gateway = "kuno_gateway.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kuno_gateway"]
