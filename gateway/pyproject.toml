[project]
name = "kuno-gateway"
version = "0.1.0"
description = "KunoWorld platform gateway (private): accounts, billing, routing and the ciphertext-only job queue"
requires-python = ">=3.10"
dependencies = [
    "kuno-protocol",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "stripe>=15",
    "py-sr25519-bindings>=0.2",
    "scalecodec>=1.2",
    # PDQ perceptual hashing (pdq.py).
    "numpy>=2.0",
]

[project.optional-dependencies]
# Watching Bittensor for TAO and alpha top-ups.
chain = ["substrate-interface>=1.8"]
# Intel DCAP quote verification, which KUNO_ATTESTATION=production needs.
attestation = ["kuno-protocol[tdx]"]
postgres = ["psycopg[binary]>=3.2"]
s3 = ["boto3>=1.35"]
observability = ["prometheus-client>=0.21", "sentry-sdk>=2.0"]

[project.scripts]
kuno-gateway = "kuno_gateway.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kuno_gateway"]
